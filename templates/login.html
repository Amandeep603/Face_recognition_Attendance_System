<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - AI Face Attendance System</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .login-page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent 40%),
                        var(--bg-primary);
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-glass);
            text-align: center;
        }
        .login-brand-icon {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #ffffff;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
        .auth-error-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="login-page-wrapper">
        <div class="login-card">
            <div class="login-brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            
            <h2 style="font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px;">
                Administrator Portal
            </h2>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 28px;">
                Sign in to manage security settings, reset attendance, and access restricted tools.
            </p>

            {% if error %}
            <div class="auth-error-badge">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST" style="text-align: left;">
                <div class="form-group" style="margin-bottom: 18px;">
                    <label for="username">Admin Username</label>
                    <div style="position: relative;">
                        <input type="text" id="username" name="username" class="form-control" 
                               placeholder="e.g. admin" required autofocus autocomplete="username"
                               style="padding-left: 38px;">
                        <i class="bi bi-person-fill" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);"></i>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 26px;">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="••••••••" required autocomplete="current-password"
                               style="padding-left: 38px;">
                        <i class="bi bi-key-fill" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px;">
                    <i class="bi bi-box-arrow-in-right"></i> Authenticate Session
                </button>
            </form>

            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-glass);">
                <a href="/" class="btn btn-secondary btn-sm" style="width: 100%; justify-content: center;">
                    <i class="bi bi-arrow-left"></i> Return to Live Dashboard
                </a>
            </div>
        </div>
    </div>
</body>
</html>
